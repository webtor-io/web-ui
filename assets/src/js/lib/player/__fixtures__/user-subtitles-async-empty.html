            <form method="post"
                  action="/user-subtitle"
                  enctype="multipart/form-data"
                  class="user-subtitle-form"
                  data-async-target="#my-subtitles"
                  data-async-push-state="false">
                <input type="hidden" name="_csrf" value="csrf">
                <input type="hidden" name="resource_id" value="res">
                <input type="hidden" name="path" value="movie.mkv">
                <input type="hidden" name="ei_url" value="http://ei.example.com">
                <label class="upload-dashed flex flex-col items-center justify-center p-6 cursor-pointer text-center rounded">
                    <span class="text-w-sub mb-2">Drop a subtitle file here or click to browse</span>
                    <span class="text-xs text-w-muted">SRT, VTT or ASS, up to 5 MB</span>
                    <input type="file" name="file" accept=".srt,.vtt,.ass,text/vtt,application/x-subrip" class="hidden user-subtitle-input">
                </label>
            </form>
