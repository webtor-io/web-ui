{{ define "library/sort"}}
{{/* A select of the library's filter form (views/library/index.html). */}}
<select class="select select-sm w-auto max-w-full bg-base-300 border-w-line focus:border-w-purple focus:outline-none" name="sort" onchange="this.form.requestSubmit()">
    {{ range $.Data | makeSort }}
        <option class="capitalize" value="{{ .Value }}" {{if .Selected }}selected{{end}}>{{ t $.Ctx.Lang .Title }}</option>
    {{ end }}
</select>
{{ end }}
