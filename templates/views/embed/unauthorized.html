<div class="flex flex-col items-center justify-center h-full text-center p-6 text-base-content/80">
    <p class="text-lg font-semibold mb-2">
        {{ t .Lang "embed.unauthorized.title" }}
    </p>
    <p class="text-sm">
        {{/* This instance's own profile: the allowed domains live there. */}}
        {{ tpHTML .Lang "embed.unauthorized.text" "Link" (printf "<a href=\"%s/profile\" class=\"link link-primary\" target=\"_blank\" rel=\"noopener\">%s</a>" domain (t .Lang "embed.unauthorized.link")) }}
    </p>
</div>
