{{ define "main" }}
{{ with .Data }}
<audio class="player"
       crossorigin="anonymous"
       preload="{{ .ExportTag.Preload }}"
       data-resource-id="{{ .VideoStreamUserData.ResourceID }}"
       {{/* The file that follows this one (jobs/scripts/next_item.go): absent =
            no "next" control, no autoplay. See docs/player.md. */}}
       {{ if .Next }}data-next-item-id="{{ .Next.ItemID }}" data-next-path="{{ .Next.Path }}" data-next-kind="{{ .Next.Kind }}" data-next-label="{{ .Next.Label }}"{{ end }}
       data-path="{{ .Item.PathStr }}"
       {{ if .TranscoderSession }}data-duration="{{ .TranscoderSession.Duration }}"
       {{ else if .MediaProbe }}data-duration="{{ .MediaProbe | getDurationSec }}" {{ end }}
       {{ if .TranscoderSession }}data-session-id="{{ .TranscoderSession.ID }}"{{ end }}
       {{ if .SessionSeekURL }}data-session-seek-url="{{ .SessionSeekURL }}"{{ end }}
       {{ if .GraceDurationSec }}data-grace-duration-sec="{{ .GraceDurationSec }}"{{ end }}
       {{- if .StatusStallSub }} data-status-stall-sub="{{ .StatusStallSub }}"{{ end }}
       {{- if .StatusFitsCap }} data-status-fits-cap{{ end }}
       {{- if .StatusOverCap }} data-status-over-cap{{ end }}
       {{- if .StatusAnswered }} data-offer-answered="continue-slow"{{ end }}
       controls
       autoplay
       data-settings="{{ .Settings | json }}">
    {{ range .ExportTag.Sources }}
    <source src="{{ .Src }}" type="{{ .Type }}">
    {{ end }}
</audio>
{{ end }}
{{ "player.css" | asset }}
{{ "action/stream.js" | asset }}
{{ end }}
